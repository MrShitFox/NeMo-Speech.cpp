name: CUDA Build and Test

on:
  push:
    branches:
      - main
      - "pull-request/[0-9]+"
  workflow_dispatch:

concurrency:
  group: cuda-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux-cuda:
    name: Linux CUDA
    if: github.repository == 'NVIDIA/NeMo-Speech.cpp'
    runs-on: linux-amd64-gpu-l4-latest-1
    timeout-minutes: 90
    container:
      image: nvcr.io/nvidia/cuda@sha256:1e8ac7a54c184a1af8ef2167f28fa98281892a835c981ebcddb1fad04bdd452d # 13.0.0-devel-ubuntu24.04
      options: -u root --security-opt seccomp=unconfined --shm-size 16g
      env:
        NVIDIA_VISIBLE_DEVICES: ${{ env.NVIDIA_VISIBLE_DEVICES }}
    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential cmake ninja-build git ca-certificates
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          submodules: recursive
      - name: Configure
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          scripts/configure.sh cuda-diar -DBUILD_TESTING=ON -DCMAKE_CUDA_ARCHITECTURES=89
      - name: Build
        run: cmake --build --preset cuda-diar --parallel
      - name: Unit tests
        run: ctest --test-dir build/cuda-diar --output-on-failure --timeout 600
