name: Build and Test

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux-cpu:
    name: Linux CPU
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build
      - name: Configure
        run: scripts/configure.sh cpu-diar -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build --preset cpu-diar --parallel
      - name: Unit tests
        run: ctest --test-dir build/cpu-diar --output-on-failure --timeout 600
      - name: CLI help
        run: build/cpu-diar/bin/nemo-speech diarize --help

  linux-vulkan:
    name: Linux Vulkan build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install Vulkan build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build \
            libvulkan-dev glslc spirv-headers
      - name: Configure
        run: scripts/configure.sh vulkan-diar -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build --preset vulkan-diar --parallel
      - name: Unit tests
        run: ctest --test-dir build/vulkan-diar --output-on-failure --timeout 600

  macos-metal:
    name: macOS Metal build
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install Ninja
        run: brew install ninja
      - name: Configure
        shell: /opt/homebrew/bin/bash -e {0}
        run: scripts/configure.sh metal-diar -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build --preset metal-diar --parallel
      - name: Unit tests
        run: ctest --test-dir build/metal-diar --output-on-failure --timeout 600
